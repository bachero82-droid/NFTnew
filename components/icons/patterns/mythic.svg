<svg viewBox="0 0 400 252" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#1a0005"/>
      <stop offset="60%" stop-color="#0a0002"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="nebula1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#dc143c" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#8b0000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="70%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#ff4444" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#cc0022" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="nebula3" cx="55%" cy="25%" r="35%">
      <stop offset="0%" stop-color="#9b1c4a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="blur3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="blur6" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blur12" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="starglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="voidglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="252" fill="url(#bg)"/>

  <!-- Nebula layers -->
  <rect width="400" height="252" fill="url(#nebula1)"/>
  <rect width="400" height="252" fill="url(#nebula2)"/>
  <rect width="400" height="252" fill="url(#nebula3)"/>

  <!-- Deep nebula blobs with blur -->
  <ellipse cx="120" cy="110" rx="90" ry="55" fill="#8b0000" fill-opacity="0.22" filter="url(#blur12)"/>
  <ellipse cx="290" cy="145" rx="80" ry="50" fill="#dc143c" fill-opacity="0.18" filter="url(#blur12)"/>
  <ellipse cx="200" cy="60" rx="70" ry="40" fill="#6b0020" fill-opacity="0.25" filter="url(#blur6)"/>
  <ellipse cx="60" cy="200" rx="55" ry="35" fill="#990020" fill-opacity="0.2" filter="url(#blur6)"/>
  <ellipse cx="340" cy="80" rx="50" ry="30" fill="#cc1133" fill-opacity="0.18" filter="url(#blur6)"/>

  <!-- Energy streams - curved crimson paths -->
  <g fill="none" filter="url(#blur3)">
    <path d="M0,80 Q100,60 180,120 Q260,180 400,140" stroke="#dc143c" stroke-width="3" stroke-opacity="0.45"/>
    <path d="M0,160 Q80,140 160,180 Q280,220 400,190" stroke="#cc0022" stroke-width="2.5" stroke-opacity="0.35"/>
    <path d="M50,0 Q120,80 100,150 Q80,220 140,252" stroke="#ff2244" stroke-width="2" stroke-opacity="0.3"/>
    <path d="M300,0 Q280,70 310,130 Q340,190 320,252" stroke="#dd1133" stroke-width="2" stroke-opacity="0.28"/>
    <path d="M0,30 Q60,50 80,100 Q100,150 60,200 Q30,240 0,252" stroke="#aa0020" stroke-width="1.5" stroke-opacity="0.3"/>
    <path d="M400,20 Q340,60 320,110 Q300,160 360,210 Q390,235 400,252" stroke="#bb1130" stroke-width="1.5" stroke-opacity="0.28"/>
  </g>

  <!-- Sharper energy streams on top -->
  <g fill="none">
    <path d="M0,80 Q100,60 180,120 Q260,180 400,140" stroke="#ff3355" stroke-width="1" stroke-opacity="0.6"/>
    <path d="M0,160 Q80,140 160,180 Q280,220 400,190" stroke="#ff2244" stroke-width="0.8" stroke-opacity="0.5"/>
    <path d="M50,0 Q120,80 100,150 Q80,220 140,252" stroke="#ff4466" stroke-width="0.8" stroke-opacity="0.45"/>
    <path d="M300,0 Q280,70 310,130 Q340,190 320,252" stroke="#ee2244" stroke-width="0.8" stroke-opacity="0.42"/>
  </g>

  <!-- Void rift - central dark crack -->
  <g filter="url(#voidglow)">
    <path d="M160,80 L200,126 L155,172" fill="none" stroke="#ff1133" stroke-width="2.5" stroke-opacity="0.7"/>
    <path d="M240,80 L200,126 L245,172" fill="none" stroke="#ff2244" stroke-width="2" stroke-opacity="0.6"/>
    <path d="M200,126 L200,40" fill="none" stroke="#ff3355" stroke-width="1.5" stroke-opacity="0.5"/>
    <path d="M200,126 L200,210" fill="none" stroke="#ee1133" stroke-width="1.5" stroke-opacity="0.45"/>
    <circle cx="200" cy="126" r="8" fill="#ff1133" fill-opacity="0.85"/>
    <circle cx="200" cy="126" r="4" fill="#ffffff" fill-opacity="0.9"/>
  </g>

  <!-- Star/spark field -->
  <g fill="#ffffff" filter="url(#starglow)">
    <!-- Bright stars -->
    <circle cx="45" cy="22" r="2.2" fill-opacity="0.95"/>
    <circle cx="355" cy="18" r="2" fill-opacity="0.9"/>
    <circle cx="18" cy="130" r="1.8" fill-opacity="0.85"/>
    <circle cx="382" cy="115" r="2" fill-opacity="0.9"/>
    <circle cx="200" cy="8" r="2.5" fill-opacity="1"/>
    <circle cx="75" cy="245" r="1.8" fill-opacity="0.8"/>
    <circle cx="325" cy="240" r="2" fill-opacity="0.85"/>
    <circle cx="130" cy="30" r="1.5" fill-opacity="0.8"/>
    <circle cx="270" cy="25" r="1.5" fill-opacity="0.8"/>
    <!-- Medium stars -->
    <circle cx="22" cy="60" r="1.2" fill-opacity="0.7"/>
    <circle cx="378" cy="65" r="1.2" fill-opacity="0.7"/>
    <circle cx="55" cy="190" r="1.2" fill-opacity="0.65"/>
    <circle cx="345" cy="195" r="1.2" fill-opacity="0.65"/>
    <circle cx="100" cy="50" r="1" fill-opacity="0.65"/>
    <circle cx="300" cy="45" r="1" fill-opacity="0.65"/>
    <circle cx="150" cy="225" r="1" fill-opacity="0.6"/>
    <circle cx="250" cy="230" r="1" fill-opacity="0.6"/>
    <!-- Small sparks -->
    <circle cx="30" cy="90" r="0.8" fill-opacity="0.55"/>
    <circle cx="370" cy="95" r="0.8" fill-opacity="0.55"/>
    <circle cx="88" cy="15" r="0.8" fill-opacity="0.55"/>
    <circle cx="312" cy="12" r="0.8" fill-opacity="0.5"/>
    <circle cx="40" cy="155" r="0.8" fill-opacity="0.5"/>
    <circle cx="360" cy="150" r="0.8" fill-opacity="0.5"/>
    <circle cx="185" cy="240" r="0.8" fill-opacity="0.5"/>
    <circle cx="215" cy="245" r="0.8" fill-opacity="0.5"/>
  </g>

  <!-- Hot red sparks near rift -->
  <g fill="#ff4466" filter="url(#starglow)">
    <circle cx="165" cy="95" r="1.5" fill-opacity="0.8"/>
    <circle cx="235" cy="90" r="1.5" fill-opacity="0.8"/>
    <circle cx="175" cy="155" r="1.3" fill-opacity="0.75"/>
    <circle cx="225" cy="158" r="1.3" fill-opacity="0.75"/>
    <circle cx="200" cy="45" r="1.5" fill-opacity="0.8"/>
    <circle cx="200" cy="205" r="1.5" fill-opacity="0.75"/>
  </g>

  <!-- Vignette -->
  <radialGradient id="vign" cx="50%" cy="50%" r="65%">
    <stop offset="35%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.7"/>
  </radialGradient>
  <rect width="400" height="252" fill="url(#vign)"/>
</svg>
