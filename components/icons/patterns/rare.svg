<svg viewBox="0 0 400 252" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020e1f"/>
      <stop offset="50%" stop-color="#041828"/>
      <stop offset="100%" stop-color="#000d18"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#0099cc" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="node1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#00bbdd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="252" fill="url(#bg)"/>
  <rect width="400" height="252" fill="url(#glow1)"/>
  <rect width="400" height="252" fill="url(#glow2)"/>

  <!-- Scan lines -->
  <pattern id="scan" width="1" height="4" patternUnits="userSpaceOnUse">
    <rect width="400" height="1" y="2" fill="#00ccff" fill-opacity="0.04"/>
  </pattern>
  <rect width="400" height="252" fill="url(#scan)"/>

  <!-- Circuit horizontal traces -->
  <g stroke="#00d4ff" stroke-opacity="0.5" stroke-width="1" fill="none">
    <polyline points="0,42 60,42 70,52 130,52 140,42 210,42"/>
    <polyline points="190,42 200,32 290,32 300,42 400,42"/>
    <polyline points="0,105 80,105 90,115 160,115"/>
    <polyline points="200,115 240,115 250,105 340,105 350,115 400,115"/>
    <polyline points="0,168 50,168 60,158 150,158 160,168 400,168"/>
    <polyline points="0,210 100,210 110,200 200,200"/>
    <polyline points="240,200 280,200 290,210 400,210"/>
  </g>

  <!-- Circuit vertical traces -->
  <g stroke="#00d4ff" stroke-opacity="0.4" stroke-width="1" fill="none">
    <polyline points="80,0 80,42"/>
    <polyline points="80,52 80,105"/>
    <polyline points="160,52 160,0"/>
    <polyline points="240,0 240,32"/>
    <polyline points="320,42 320,105"/>
    <polyline points="110,115 110,168"/>
    <polyline points="280,115 280,168"/>
    <polyline points="60,168 60,210"/>
    <polyline points="200,168 200,200"/>
    <polyline points="320,168 320,252"/>
    <polyline points="160,210 160,252"/>
  </g>

  <!-- L-bends and corner connectors -->
  <g stroke="#00ffff" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <polyline points="40,0 40,25 65,25 65,42"/>
    <polyline points="190,168 190,185 220,185 220,210"/>
    <polyline points="350,105 350,130 380,130 380,168"/>
  </g>

  <!-- Glowing nodes -->
  <g filter="url(#glow)">
    <circle cx="80" cy="42" r="4" fill="#00ffff" fill-opacity="0.9"/>
    <circle cx="160" cy="52" r="3" fill="#00eeff" fill-opacity="0.85"/>
    <circle cx="240" cy="32" r="5" fill="#00ccff" fill-opacity="0.9"/>
    <circle cx="320" cy="42" r="3.5" fill="#00ffff" fill-opacity="0.8"/>
    <circle cx="80" cy="105" r="4" fill="#00ddff" fill-opacity="0.9"/>
    <circle cx="160" cy="115" r="3" fill="#00ffff" fill-opacity="0.8"/>
    <circle cx="280" cy="115" r="5" fill="#00eeff" fill-opacity="0.85"/>
    <circle cx="320" cy="105" r="3" fill="#00ccff" fill-opacity="0.9"/>
    <circle cx="60" cy="168" r="4" fill="#00ffff" fill-opacity="0.9"/>
    <circle cx="160" cy="168" r="3.5" fill="#00ddff" fill-opacity="0.8"/>
    <circle cx="280" cy="168" r="4" fill="#00ffff" fill-opacity="0.85"/>
    <circle cx="200" cy="200" r="5" fill="#00eeff" fill-opacity="0.9"/>
    <circle cx="320" cy="210" r="3" fill="#00ccff" fill-opacity="0.8"/>
  </g>

  <!-- Large glow circles -->
  <circle cx="240" cy="32" r="18" fill="none" stroke="#00ccff" stroke-width="1" stroke-opacity="0.2" filter="url(#softglow)"/>
  <circle cx="200" cy="200" r="22" fill="none" stroke="#00ddff" stroke-width="1.5" stroke-opacity="0.18" filter="url(#softglow)"/>

  <!-- Small data dots -->
  <g fill="#00d4ff" fill-opacity="0.4">
    <circle cx="40" cy="25" r="2"/><circle cx="65" cy="25" r="2"/>
    <circle cx="190" cy="185" r="2"/><circle cx="220" cy="185" r="2"/>
    <circle cx="350" cy="130" r="2"/><circle cx="380" cy="130" r="2"/>
  </g>

  <!-- Corner frame accent -->
  <rect x="10" y="10" width="380" height="232" rx="8" fill="none" stroke="#00aacc" stroke-width="1" stroke-opacity="0.3"/>
</svg>
